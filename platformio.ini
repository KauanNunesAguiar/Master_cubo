; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = arduino
upload_protocol = serial
upload_port = com17
monitor_port = com17
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.6
	stm32duino/STM32duino FreeRTOS
	adafruit/Adafruit NeoPixel@^1.15.5
build_src_filter = +<*> -<flasher/> -<sweep/>
build_unflags = -Os
build_flags = 
    -O2
    -D INCLUDE_uxTaskGetStackHighWaterMark=1
    -D SOLVER_EVENTS=1

[env:flasher]
extends = env:black_f407ve
build_src_filter = -<*> +<flasher/>
lib_deps = adafruit/Adafruit NeoPixel@^1.15.5

[env:sweep]
extends = env:black_f407ve
build_src_filter = -<*> +<sweep/>
build_flags =
    -O2
    -D METRICS_ENABLED=0
    -D SOLVER_EVENTS=0
